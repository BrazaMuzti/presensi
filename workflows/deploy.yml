name: Deploy Tailwind to GitHub Pages

on:
  push:
    branches:
      - main # Ubah ke 'master' jika branch utama Anda masih menggunakan nama lama

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Tailwind CSS
        run: npm install -D tailwindcss

      - name: Build Tailwind CSS
        # Sesuaikan letak file input dan output CSS Anda di sini
        run: npx tailwindcss -i ./src/input.css -o ./dist/output.css --minify

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Mengunggah seluruh root direktori (termasuk file HTML dan folder dist yang baru di-build)
          path: '.' 

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
