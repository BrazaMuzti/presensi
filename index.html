    <!-- ================= SCRIPT UTAMA APLIKASI ================= -->
    <script>
        let currentUser = null;
        let globalData = { siswa: [], guru: [], presensi: [], penganturan: [] };

        // Cek Sesi Tersimpan
        window.onload = () => {
            const savedUser = localStorage.getItem('currentUser');
            if (savedUser) {
                currentUser = JSON.parse(savedUser);
                initApp();
            }
            updateClock();
            setInterval(updateClock, 1000);
        };

        function updateClock() {
            const now = new Date();
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit' };
            const el = document.getElementById('currentDateTime');
            if(el) el.innerText = now.toLocaleDateString('id-ID', options);
        }

        // Handle Login
        async function handleLogin(e) {
            e.preventDefault();
            const role = document.getElementById('loginRole').value;
            const username = document.getElementById('loginUser').value.trim();
            const password = document.getElementById('loginPass').value.trim();

            Swal.showLoading();

            try {
                const res = await callAPI({ action: 'login', role, username, password });
                if (res.status === 'success') {
                    Swal.close();
                    currentUser = res.user;
                    localStorage.setItem('currentUser', JSON.stringify(currentUser));
                    initApp();
                } else {
                    Swal.fire('Login Gagal', res.message || 'Username atau password salah', 'error');
                }
            } catch (err) {
                // Fallback Mock Mode jika GAS belum terhubung sempurna
                if(username === "admin" || username === "12345") {
                    Swal.close();
                    currentUser = { username, nama: "Pengguna Uji Coba", role: role, kelas: "XII RPL 1" };
                    localStorage.setItem('currentUser', JSON.stringify(currentUser));
                    initApp();
                } else {
                    Swal.fire('Error Koneksi', 'Gagal terhubung ke Google Apps Script. Pastikan URL GAS benar.', 'error');
                }
            }
        }

        async function callAPI(payload) {
            const response = await fetch(GAS_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(payload)
            });
            return await response.json();
        }

        function logout() {
            localStorage.removeItem('currentUser');
            location.reload();
        }

        function initApp() {
            document.getElementById('loginPage').classList.add('hidden');
            document.getElementById('mainApp').classList.remove('hidden');
            document.getElementById('userNameDisplay').innerText = currentUser.nama;
            document.getElementById('userRoleBadge').innerText = currentUser.role === 'guru' ? 'Guru / Admin' : 'Siswa - ' + (currentUser.kelas || '');

            buildSidebar();
            loadDashboard();
        }

            if (currentUser.role === 'guru') {

                    <a href="#" onclick="loadLaporan()" class="flex items-center space-x-3 px-4 py-2.5 rounded-xl text-sm font-medium text-slate-300 hover:bg-slate-800"><i class="fa-solid fa-file-lines w-5"></i><span>Laporan Absensi</span></a>

            `;
