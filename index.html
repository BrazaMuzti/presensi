<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduPresensi Digital</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 font-sans">

    <!-- Login View -->
    <div id="loginView" class="fixed inset-0 flex items-center justify-center bg-blue-900 p-4">
        <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-sm">
            <h1 class="text-2xl font-bold text-center mb-6 text-blue-900">EduPresensi</h1>
            <form id="loginForm">
                <div class="mb-4">
                    <label class="block text-sm font-bold mb-2">Masuk Sebagai</label>
                    <div class="flex gap-4">
                        <label><input type="radio" name="role" value="siswa" checked> Siswa</label>
                        <label><input type="radio" name="role" value="guru"> Guru</label>
                    </div>
                </div>
                <input type="text" id="username" placeholder="Username / NIS / NIP" class="w-full p-3 mb-3 border rounded-lg" required>
                <input type="password" id="password" placeholder="Password" class="w-full p-3 mb-6 border rounded-lg" required>
                <button type="submit" id="loginBtn" class="w-full bg-blue-600 text-white py-3 rounded-lg font-bold">Masuk</button>
            </form>
        </div>
    </div>

    <!-- App Container (Hidden by default) -->
    <div id="appContainer" class="hidden">
        <nav class="bg-indigo-900 text-white p-4 flex justify-between items-center">
            <span class="font-bold">EduPresensi</span>
            <button onclick="logout()" class="text-red-300 text-sm"><i class="fa-solid fa-sign-out-alt"></i> Keluar</button>
        </nav>
        <div id="mainContent" class="p-4">
            <h2 class="text-xl font-bold mb-4">Selamat Datang, <span id="userName">User</span></h2>
            <div id="dashboardStats" class="grid grid-cols-2 gap-4">
                <!-- Statistik akan dimuat di sini -->
            </div>
        </div>
    </div>

    <script>
        // --- KONFIGURASI ---
        const GAS_URL = "https://script.google.com/macros/s/AKfycbwmdoKb39_EixYq7Ls42kpoQJLrooQgSIpFB-WMM_6Kv0SPJ4pd6-xKSGCb_gno4_Pm/exec"; 

        // --- AUTH LOGIC ---
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            btn.innerText = "Memproses...";
            btn.disabled = true;

            const payload = {
                action: 'login',
                role: document.querySelector('input[name="role"]:checked').value,
                username: document.getElementById('username').value,
                password: document.getElementById('password').value
            };

            try {
                const response = await fetch(GAS_URL, {
                    method: 'POST',
                    mode: 'no-cors', // Penting untuk menghindari CORS error
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                // Karena no-cors, kita tidak bisa membaca response.json()
                // Untuk tahap awal, mari kita asumsikan sukses dan lanjut ke dashboard
                loginSuccess(payload); 
            } catch (err) {
                alert("Error koneksi: " + err);
            } finally {
                btn.innerText = "Masuk";
                btn.disabled = false;
            }
        });

        function loginSuccess(user) {
            document.getElementById('loginView').classList.add('hidden');
            document.getElementById('appContainer').classList.remove('hidden');
            document.getElementById('userName').innerText = user.username;
        }

        function logout() {
            location.reload();
        }
    </script>
</body>
</html>
