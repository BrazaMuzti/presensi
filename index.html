<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Presensi Sekolah Modern</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .glass-effect { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Animasi Transisi */
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Print Styles untuk Laporan */
        @media print {
            body { background-color: white; }
            .no-print { display: none !important; }
            .print-only { display: block !important; }
            .print-container { width: 100%; margin: 0; padding: 0; }
            .signature-area { margin-top: 50px; display: flex; justify-content: space-between; page-break-inside: avoid; }
        }
        .print-only { display: none; }
    </style>
</head>
<body class="text-gray-800 h-screen overflow-hidden flex flex-col md:flex-row">

    <div id="loginView" class="fixed inset-0 z-50 flex items-center justify-center bg-gradient-to-br from-blue-600 to-indigo-800 fade-in">
        <div class="bg-white p-8 rounded-2xl shadow-2xl w-11/12 max-w-md relative overflow-hidden">
            <div class="absolute top-0 left-0 w-full h-2 bg-blue-500"></div>
            <div class="text-center mb-8">
                <i class="fa-solid fa-graduation-cap text-5xl text-blue-600 mb-3"></i>
                <h1 class="text-2xl font-bold text-gray-800">EduPresensi</h1>
                <p class="text-gray-500 text-sm">Sistem Kehadiran Digital Terpadu</p>
            </div>
            
            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="mb-4">
                    <label class="block text-gray-700 text-sm font-semibold mb-2">Masuk Sebagai</label>
                    <div class="flex gap-4">
                        <label class="flex items-center gap-2 cursor-pointer">
                            <input type="radio" name="role" value="siswa" checked class="text-blue-600 focus:ring-blue-500 h-4 w-4">
                            <span class="text-sm">Siswa</span>
                        </label>
                        <label class="flex items-center gap-2 cursor-pointer">
                            <input type="radio" name="role" value="guru" class="text-blue-600 focus:ring-blue-500 h-4 w-4">
                            <span class="text-sm">Guru / Admin</span>
                        </label>
                    </div>
                </div>
                <div class="mb-4">
                    <label class="block text-gray-700 text-sm font-semibold mb-2" for="username">Username (NIS / NIP)</label>
                    <div class="relative">
                        <i class="fa-solid fa-user absolute left-3 top-3 text-gray-400"></i>
                        <input class="w-full pl-10 pr-3 py-2 rounded-lg border border-gray-300 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500" id="username" type="text" placeholder="Masukkan NIS atau NIP" required>
                    </div>
                </div>
                <div class="mb-6">
                    <label class="block text-gray-700 text-sm font-semibold mb-2" for="password">Password</label>
                    <div class="relative">
                        <i class="fa-solid fa-lock absolute left-3 top-3 text-gray-400"></i>
                        <input class="w-full pl-10 pr-3 py-2 rounded-lg border border-gray-300 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500" id="password" type="password" placeholder="********" required>
                    </div>
                </div>
                <button class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg transition duration-200 shadow-lg shadow-blue-500/30" type="submit">
                    <i class="fa-solid fa-right-to-bracket mr-2"></i> Masuk
                </button>
                <div class="mt-4 text-center">
                    <p class="text-xs text-gray-500">Mode Simulasi Aktif. Coba Siswa: 12345/pass, Guru: 1980/pass</p>
                </div>
            </form>
        </div>
    </div>

    <div id="appContainer" class="hidden w-full h-full">
        
        <!-- Sidebar Navigation (Mobile Overlay) -->
        <div id="mobileOverlay" class="fixed inset-0 bg-black bg-opacity-50 z-40 hidden md:hidden" onclick="toggleSidebar()"></div>
        
        <!-- Sidebar -->
        <nav id="sidebar" class="bg-indigo-900 text-white w-64 flex-shrink-0 h-full fixed md:relative z-50 transform -translate-x-full md:translate-x-0 transition-transform duration-300 ease-in-out">
            <div class="p-5 flex items-center justify-between bg-indigo-950 border-b border-indigo-800">
                <div class="flex items-center gap-3">
                    <i class="fa-solid fa-graduation-cap text-2xl text-blue-400"></i>
                    <span class="font-bold text-xl tracking-wider">EduPresensi</span>
                </div>
                <button class="md:hidden text-gray-300 hover:text-white" onclick="toggleSidebar()">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>
            
            <div class="p-5 text-center border-b border-indigo-800">
                <div class="w-16 h-16 rounded-full bg-indigo-700 mx-auto flex items-center justify-center text-2xl font-bold mb-2 shadow-inner">
                    <i id="userIcon" class="fa-solid fa-user"></i>
                </div>
                <h3 id="sidebarName" class="font-semibold text-sm">Nama Pengguna</h3>
                <p id="sidebarRole" class="text-xs text-indigo-300 capitalize">Role</p>
            </div>

            <div class="overflow-y-auto h-[calc(100%-180px)] hide-scrollbar p-3">
                <ul class="space-y-1" id="menuList">
                    <!-- Menu dinamis di-render oleh JS -->
                </ul>
            </div>
            
            <div class="absolute bottom-0 w-full p-3 border-t border-indigo-800 bg-indigo-900">
                <button onclick="logout()" class="w-full flex items-center gap-3 p-3 text-red-300 hover:text-red-100 hover:bg-red-900/50 rounded-lg transition-colors">
                    <i class="fa-solid fa-sign-out-alt"></i>
                    <span>Keluar</span>
                </button>
            </div>
        </nav>

        <!-- Main Content Area -->
        <main class="flex-1 flex flex-col h-full overflow-hidden bg-gray-50 relative w-full">
            
            <!-- Topbar -->
            <header class="bg-white shadow-sm z-30 h-16 flex items-center justify-between px-4 lg:px-8 no-print">
                <div class="flex items-center gap-4">
                    <button class="md:hidden text-gray-600 hover:text-gray-900 p-1" onclick="toggleSidebar()">
                        <i class="fa-solid fa-bars text-xl"></i>
                    </button>
                    <h2 id="pageTitle" class="font-semibold text-lg text-gray-800 hidden sm:block">Dashboard</h2>
                </div>
                <div class="flex items-center gap-4">
                    <div id="liveClock" class="text-sm font-medium text-gray-600 bg-gray-100 px-3 py-1 rounded-full border border-gray-200">
                        <i class="fa-regular fa-clock mr-1 text-blue-500"></i> <span>00:00:00</span>
                    </div>
                    <div id="syncStatus" class="text-xs text-green-600 font-semibold flex items-center gap-1" title="Tersinkronisasi dengan Spreadsheet">
                        <i class="fa-solid fa-cloud-check"></i> <span class="hidden sm:inline">Online</span>
                    </div>
                </div>
            </header>

            <!-- Scrollable Content -->
            <div id="mainContent" class="flex-1 overflow-y-auto p-4 lg:p-8 relative">
                <!-- Tampilan di-inject di sini oleh JS -->
            </div>
        </main>
    </div>

    <template id="tpl-dashboard-admin">
        <div class="fade-in space-y-6">
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 bg-white p-4 rounded-xl shadow-sm border border-gray-100">
                <div>
                    <h3 class="text-lg font-bold text-gray-800">Ringkasan Hari Ini</h3>
                    <p id="dashDate" class="text-sm text-gray-500">Senin, 1 Jan 2024</p>
                </div>
                <div class="flex gap-2">
                    <button onclick="refreshData()" class="px-3 py-1.5 bg-blue-50 text-blue-600 rounded-lg text-sm hover:bg-blue-100 transition"><i class="fa-solid fa-rotate mr-1"></i> Refresh</button>
                    <select class="px-3 py-1.5 bg-gray-50 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-blue-500">
                        <option>Semua Kelas</option>
                        <option>X-IPA-1</option>
                        <option>XI-IPS-2</option>
                    </select>
                </div>
            </div>

            <!-- Kartu Statistik -->
            <div class="grid grid-cols-2 md:grid-cols-5 gap-4">
                <div class="bg-white p-4 rounded-xl shadow-sm border-l-4 border-blue-500 flex flex-col justify-between">
                    <div class="text-gray-500 text-xs font-semibold uppercase tracking-wider mb-2">Total Siswa</div>
                    <div class="text-2xl font-bold text-gray-800" id="statTotal">0</div>
                </div>
                <div class="bg-white p-4 rounded-xl shadow-sm border-l-4 border-green-500 flex flex-col justify-between">
                    <div class="text-gray-500 text-xs font-semibold uppercase tracking-wider mb-2">Hadir</div>
                    <div class="text-2xl font-bold text-green-600" id="statHadir">0</div>
                </div>
                <div class="bg-white p-4 rounded-xl shadow-sm border-l-4 border-yellow-500 flex flex-col justify-between">
                    <div class="text-gray-500 text-xs font-semibold uppercase tracking-wider mb-2">Sakit</div>
                    <div class="text-2xl font-bold text-yellow-600" id="statSakit">0</div>
                </div>
                <div class="bg-white p-4 rounded-xl shadow-sm border-l-4 border-purple-500 flex flex-col justify-between">
                    <div class="text-gray-500 text-xs font-semibold uppercase tracking-wider mb-2">Izin</div>
                    <div class="text-2xl font-bold text-purple-600" id="statIzin">0</div>
                </div>
                <div class="bg-white p-4 rounded-xl shadow-sm border-l-4 border-red-500 flex flex-col justify-between">
                    <div class="text-gray-500 text-xs font-semibold uppercase tracking-wider mb-2">Alpha</div>
                    <div class="text-2xl font-bold text-red-600" id="statAlpha">0</div>
                </div>
            </div>

            <!-- Akses Cepat & Grafik -->
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <div class="lg:col-span-2 bg-white p-5 rounded-xl shadow-sm border border-gray-100">
                    <h3 class="text-md font-bold text-gray-800 mb-4">Grafik Kehadiran Bulan Ini</h3>
                    <div class="h-64 w-full">
                        <canvas id="attendanceChart"></canvas>
                    </div>
                </div>
                <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-100">
                    <h3 class="text-md font-bold text-gray-800 mb-4">Akses Cepat</h3>
                    <div class="grid grid-cols-2 gap-3">
                        <button onclick="switchMenu('scan')" class="p-4 rounded-xl bg-blue-50 text-blue-700 hover:bg-blue-100 flex flex-col items-center justify-center gap-2 transition">
                            <i class="fa-solid fa-qrcode text-2xl"></i>
                            <span class="text-sm font-semibold">Scan QR</span>
                        </button>
                        <button onclick="switchMenu('input')" class="p-4 rounded-xl bg-green-50 text-green-700 hover:bg-green-100 flex flex-col items-center justify-center gap-2 transition">
                            <i class="fa-solid fa-clipboard-user text-2xl"></i>
                            <span class="text-sm font-semibold">Input Manual</span>
                        </button>
                        <button onclick="switchMenu('laporan')" class="p-4 rounded-xl bg-purple-50 text-purple-700 hover:bg-purple-100 flex flex-col items-center justify-center gap-2 transition">
                            <i class="fa-solid fa-file-contract text-2xl"></i>
                            <span class="text-sm font-semibold">Laporan</span>
                        </button>
                        <button onclick="switchMenu('pengaturan')" class="p-4 rounded-xl bg-gray-50 text-gray-700 hover:bg-gray-100 flex flex-col items-center justify-center gap-2 transition">
                            <i class="fa-solid fa-calendar-alt text-2xl"></i>
                            <span class="text-sm font-semibold">Jadwal & Libur</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </template>

    <template id="tpl-data-table">
        <div class="fade-in bg-white rounded-xl shadow-sm border border-gray-100 flex flex-col h-full">
            <div class="p-5 border-b border-gray-100 flex flex-col sm:flex-row justify-between items-center gap-4">
                <div class="flex items-center gap-3 w-full sm:w-auto">
                    <select id="tableShow" class="bg-gray-50 border border-gray-200 text-gray-700 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-2">
                        <option value="10">Show 10</option>
                        <option value="20">Show 20</option>
                        <option value="50">Show 50</option>
                    </select>
                    <select id="tableFilterClass" class="bg-gray-50 border border-gray-200 text-gray-700 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-2 hidden">
                        <option value="all">Semua Kelas</option>
                        <option value="X-IPA-1">X-IPA-1</option>
                        <option value="XI-IPS-2">XI-IPS-2</option>
                    </select>
                </div>
                <div class="flex items-center gap-3 w-full sm:w-auto">
                    <div class="relative w-full sm:w-64">
                        <div class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none">
                            <i class="fa-solid fa-search text-gray-400"></i>
                        </div>
                        <input type="text" id="tableSearch" class="bg-gray-50 border border-gray-200 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full pl-10 p-2" placeholder="Cari nama/username...">
                    </div>
                    <button class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 text-sm font-medium whitespace-nowrap" onclick="showModal('add')">
                        <i class="fa-solid fa-plus mr-1"></i> Tambah
                    </button>
                </div>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-sm text-left text-gray-500">
                    <thead class="text-xs text-gray-700 uppercase bg-gray-50 border-b border-gray-200">
                        <tr id="tableHead">
                            <!-- Injeksi JS -->
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <!-- Injeksi JS -->
                    </tbody>
                </table>
            </div>
            <div class="p-4 border-t border-gray-100 flex justify-between items-center text-sm text-gray-600">
                <span>Menampilkan 1 hingga 10 dari 50 entri</span>
                <div class="flex gap-1">
                    <button class="px-3 py-1 border border-gray-200 rounded hover:bg-gray-50 text-gray-400">Prev</button>
                    <button class="px-3 py-1 bg-blue-50 text-blue-600 border border-blue-100 rounded font-medium">1</button>
                    <button class="px-3 py-1 border border-gray-200 rounded hover:bg-gray-50">Next</button>
                </div>
            </div>
        </div>
    </template>

    <template id="tpl-input-presensi">
        <div class="fade-in space-y-4">
            <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 flex flex-wrap gap-4 items-center justify-between">
                <div class="flex items-center gap-3">
                    <label class="font-semibold text-gray-700">Kelas:</label>
                    <select id="presensiClass" class="bg-gray-50 border border-gray-200 text-gray-700 text-sm rounded-lg p-2" onchange="renderPresensiList()">
                        <option value="X-IPA-1">X-IPA-1</option>
                        <option value="XI-IPS-2">XI-IPS-2</option>
                    </select>
                </div>
                <div class="flex gap-2 text-sm">
                    <button class="bg-green-600 text-white px-4 py-2 rounded-lg hover:bg-green-700" onclick="setAll('H')"><i class="fa-solid fa-check mr-1"></i> Hadir Semua</button>
                    <button class="bg-gray-800 text-white px-4 py-2 rounded-lg hover:bg-gray-900" onclick="savePresensiManual()"><i class="fa-solid fa-save mr-1"></i> Simpan Selesai</button>
                </div>
            </div>

            <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-x-auto">
                <table class="w-full text-sm text-left text-gray-500">
                    <thead class="text-xs text-gray-700 uppercase bg-gray-50 border-b border-gray-200">
                        <tr>
                            <th class="px-6 py-3">No</th>
                            <th class="px-6 py-3">NIS</th>
                            <th class="px-6 py-3">Nama Siswa</th>
                            <th class="px-6 py-3 text-center">Kehadiran (H / S / I / A)</th>
                            <th class="px-6 py-3">Catatan</th>
                        </tr>
                    </thead>
                    <tbody id="presensiList">
                        <!-- JS Injeksi -->
                    </tbody>
                </table>
            </div>
        </div>
    </template>

    <template id="tpl-scan-presensi">
        <div class="fade-in grid grid-cols-1 lg:grid-cols-2 gap-6">
            <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-100 flex flex-col items-center">
                <h3 class="text-lg font-bold text-gray-800 mb-4 w-full text-center border-b pb-2">Scan QR Code Siswa</h3>
                
                <div id="reader" class="w-full max-w-sm overflow-hidden rounded-lg shadow-inner bg-black min-h-[300px] flex items-center justify-center relative">
                    <!-- Scanner Container -->
                </div>
                
                <div class="mt-6 flex gap-3 w-full justify-center">
                    <button id="btnCameraToggle" class="bg-gray-200 text-gray-700 px-4 py-2 rounded-lg hover:bg-gray-300 font-medium text-sm flex items-center gap-2" onclick="toggleCamera()">
                        <i class="fa-solid fa-camera-rotate"></i> Ganti Kamera
                    </button>
                    <button id="btnScanStop" class="bg-red-50 text-red-600 px-4 py-2 rounded-lg hover:bg-red-100 font-medium text-sm flex items-center gap-2 hidden" onclick="stopScanner()">
                        <i class="fa-solid fa-stop"></i> Berhenti
                    </button>
                </div>

                <div class="mt-4 p-3 bg-blue-50 text-blue-800 text-xs rounded-lg w-full text-center border border-blue-100 flex items-center justify-center gap-2">
                    <i class="fa-solid fa-location-dot"></i> GPS Aktif (Latitude: <span id="gpsLat">-</span>, Longitude: <span id="gpsLng">-</span>)
                </div>
            </div>

            <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-100 flex flex-col h-full max-h-[500px]">
                <h3 class="text-lg font-bold text-gray-800 mb-2 border-b pb-2">Log Hasil Scan Hari Ini</h3>
                <div class="overflow-y-auto flex-1 hide-scrollbar" id="scanLogs">
                    <!-- Logs injection -->
                    <div class="text-center text-gray-400 py-10 italic text-sm">Belum ada data scan.</div>
                </div>
            </div>
        </div>
    </template>

    <template id="tpl-dashboard-siswa">
        <div class="fade-in space-y-6">
            <div class="bg-gradient-to-r from-blue-600 to-indigo-700 rounded-2xl p-6 text-white shadow-lg flex flex-col md:flex-row justify-between items-center gap-4">
                <div>
                    <h2 class="text-2xl font-bold">Halo, <span id="studentNameDisplay">Budi Santoso</span>!</h2>
                    <p class="text-blue-100 mt-1"><i class="fa-solid fa-id-card mr-1"></i> NIS: <span id="studentNisDisplay">12345</span> | Kelas: X-IPA-1</p>
                    <p class="text-blue-200 text-sm mt-3"><i class="fa-regular fa-clock mr-1"></i> Jadwal Hari Ini: 07:00 - 14:30 WIB</p>
                </div>
                <button onclick="switchMenu('kartu')" class="bg-white text-blue-700 px-5 py-2.5 rounded-xl font-bold shadow-md hover:bg-blue-50 transition flex items-center gap-2">
                    <i class="fa-solid fa-qrcode"></i> Tampilkan Kartu QR
                </button>
            </div>

            <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 text-center">
                    <div class="text-gray-500 text-xs font-semibold uppercase tracking-wider mb-1">Hadir Semester Ini</div>
                    <div class="text-2xl font-bold text-green-600">42</div>
                </div>
                <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 text-center">
                    <div class="text-gray-500 text-xs font-semibold uppercase tracking-wider mb-1">Sakit</div>
                    <div class="text-2xl font-bold text-yellow-600">2</div>
                </div>
                <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 text-center">
                    <div class="text-gray-500 text-xs font-semibold uppercase tracking-wider mb-1">Izin</div>
                    <div class="text-2xl font-bold text-purple-600">0</div>
                </div>
                <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 text-center">
                    <div class="text-gray-500 text-xs font-semibold uppercase tracking-wider mb-1">Alpha</div>
                    <div class="text-2xl font-bold text-red-600">1</div>
                </div>
            </div>

            <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-100">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-md font-bold text-gray-800">Riwayat Kehadiran Terbaru</h3>
                </div>
                <table class="w-full text-sm text-left text-gray-500">
                    <thead class="text-xs text-gray-700 uppercase bg-gray-50">
                        <tr><th class="px-4 py-2">Tanggal</th><th class="px-4 py-2">Waktu Scan</th><th class="px-4 py-2">Status</th></tr>
                    </thead>
                    <tbody id="studentHistoryTable">
                        <!-- JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </template>

    <template id="tpl-kartu-siswa">
        <div class="fade-in flex flex-col items-center justify-center min-h-[60vh]">
            <div class="bg-white p-8 rounded-2xl shadow-xl border border-gray-200 max-w-sm w-full text-center relative overflow-hidden">
                <div class="absolute top-0 left-0 w-full h-24 bg-gradient-to-r from-blue-600 to-indigo-800"></div>
                <div class="relative z-10">
                    <img src="https://placehold.co/100x100/ffffff/4f46e5?text=Foto" class="w-24 h-24 rounded-full border-4 border-white mx-auto shadow-md mb-4 bg-white" alt="Profile">
                    <h3 class="text-xl font-bold text-gray-800" id="cardName">Nama Siswa</h3>
                    <p class="text-gray-500 text-sm mb-6" id="cardDetails">NIS: 12345 | Kelas: X-IPA-1</p>
                    
                    <div class="bg-gray-50 p-4 rounded-xl inline-block shadow-inner mb-4">
                        <div id="qrcodeBox" class="mx-auto"></div>
                    </div>
                    
                    <p class="text-xs text-gray-400 mt-2">Tunjukkan QR Code ini ke kamera pemindai untuk melakukan presensi.</p>
                </div>
            </div>
        </div>
    </template>

    <template id="tpl-laporan">
        <div class="fade-in bg-white rounded-xl shadow-sm border border-gray-100 print-container">
            <div class="p-5 border-b border-gray-100 flex flex-col sm:flex-row justify-between items-center gap-4 no-print">
                <div class="flex gap-3">
                    <input type="date" class="bg-gray-50 border border-gray-200 text-sm rounded-lg p-2">
                    <select class="bg-gray-50 border border-gray-200 text-sm rounded-lg p-2">
                        <option>Semua Kelas</option><option>X-IPA-1</option>
                    </select>
                </div>
                <button onclick="window.print()" class="bg-indigo-600 text-white px-4 py-2 rounded-lg hover:bg-indigo-700 text-sm font-medium">
                    <i class="fa-solid fa-print mr-1"></i> Cetak Laporan
                </button>
            </div>
            
            <div class="p-8">
                <div class="text-center mb-8 print-only">
                    <h2 class="text-xl font-bold uppercase">Laporan Kehadiran Siswa</h2>
                    <h3 class="text-lg font-semibold">SMA Negeri 1 Contoh</h3>
                    <p class="text-sm">Tanggal: <span id="printDate"></span> | Kelas: X-IPA-1</p>
                    <hr class="mt-4 border-black">
                </div>

                <table class="w-full text-sm text-left text-gray-800 border-collapse border border-gray-300">
                    <thead class="text-xs uppercase bg-gray-100">
                        <tr>
                            <th class="border border-gray-300 px-4 py-2">No</th>
                            <th class="border border-gray-300 px-4 py-2">NIS</th>
                            <th class="border border-gray-300 px-4 py-2">Nama Lengkap</th>
                            <th class="border border-gray-300 px-4 py-2 text-center">Status</th>
                            <th class="border border-gray-300 px-4 py-2">Waktu</th>
                        </tr>
                    </thead>
                    <tbody id="reportTableBody">
                        <!-- JS -->
                    </tbody>
                </table>

                <div class="signature-area hidden print-only text-sm text-center">
                    <div>
                        <p>Mengetahui,</p>
                        <p class="mb-16">Kepala Sekolah</p>
                        <p class="font-bold underline">Dr. Budi Santoso, M.Pd</p>
                        <p>NIP. 19700101 199512 1 001</p>
                    </div>
                    <div>
                        <p>Banjar, <span id="sigDate"></span></p>
                        <p class="mb-16">Guru Kelas / Wali Kelas</p>
                        <p class="font-bold underline">Siti Aminah, S.Pd</p>
                        <p>NIP. 19850202 201001 2 005</p>
                    </div>
                </div>
            </div>
        </div>
    </template>

    <script>
        // -- Konfigurasi & State --
        // URL Google Apps Script Web App (Kosongkan jika menggunakan mock)
        const GAS_URL = "https://script.google.com/macros/s/AKfycbyZwEnEiFM6YfeXLCGLDs1Nq0d46HA0wOmrO4gUumR1tATH6DhKoHXHByZYZ0iG_XRB/exec"; 
        
        let appState = {
            user: null, // { username, name, role, class }
            currentView: 'dashboard',
            scanner: null,
            facingMode: "environment" // camera belakang default
        };

        // Data Mocking (Simulasi Database)
        const mockData = {
            siswa: [
                { id: '1', nis: '12345', nama: 'Budi Santoso', kelas: 'X-IPA-1', jk: 'L', pass: 'pass' },
                { id: '2', nis: '12346', nama: 'Siti Aminah', kelas: 'X-IPA-1', jk: 'P', pass: 'pass' },
                { id: '3', nis: '12347', nama: 'Andi Wijaya', kelas: 'XI-IPS-2', jk: 'L', pass: 'pass' }
            ],
            guru: [
                { id: '1', nip: '1980', nama: 'Bpk. Suryono', kelas: 'X-IPA-1', pass: 'pass' },
                { id: '2', nip: '1981', nama: 'Ibu Ratna', kelas: 'Semua', pass: 'pass' }
            ],
            presensiHariIni: [
                { nis: '12346', nama: 'Siti Aminah', status: 'H', waktu: '06:45', metode: 'Scan' }
            ]
        };

        // -- Utilitas --
        const $ = (id) => document.getElementById(id);
        
        function updateClock() {
            const now = new Date();
            const timeString = now.toLocaleTimeString('id-ID', { hour12: false });
            if($('liveClock')) $('liveClock').innerHTML = `<i class="fa-regular fa-clock mr-1 text-blue-500"></i> <span>${timeString}</span>`;
            if($('dashDate')) {
                const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
                $('dashDate').innerText = now.toLocaleDateString('id-ID', options);
            }
        }
        setInterval(updateClock, 1000);

        function toggleSidebar() {
            const sidebar = $('sidebar');
            const overlay = $('mobileOverlay');
            sidebar.classList.toggle('-translate-x-full');
            overlay.classList.toggle('hidden');
        }

        // -- Auth Logic --
        function handleLogin(e) {
            e.preventDefault();
            const role = document.querySelector('input[name="role"]:checked').value;
            const user = $('username').value;
            const pass = $('password').value;

            // Simulasi Login
            let foundUser = null;
            if (role === 'siswa') {
                foundUser = mockData.siswa.find(s => s.nis === user && s.pass === pass);
                if (foundUser) foundUser.role = 'siswa';
            } else {
                foundUser = mockData.guru.find(g => g.nip === user && g.pass === pass);
                if (foundUser) foundUser.role = 'guru';
            }

            if (foundUser) {
                appState.user = foundUser;
                $('loginView').classList.add('hidden');
                $('appContainer').classList.remove('hidden');
                setupSidebar();
                switchMenu('dashboard');
                
                // Set Global Info
                $('sidebarName').innerText = foundUser.nama;
                $('sidebarRole').innerText = role === 'guru' ? 'Guru / Admin' : 'Siswa';
                $('userIcon').className = role === 'guru' ? 'fa-solid fa-user-tie' : 'fa-solid fa-user-graduate';
                
            } else {
                alert("Username atau password salah! (Gunakan data mock yang tersedia di text bawah tombol login)");
            }
        }

        function logout() {
            if(!confirm("Yakin ingin keluar?")) return;
            if(appState.scanner) stopScanner();
            appState.user = null;
            $('appContainer').classList.add('hidden');
            $('loginView').classList.remove('hidden');
            $('loginForm').reset();
        }

        // -- Navigation & View Logic --
        const menus = {
            guru: [
                { id: 'dashboard', icon: 'fa-chart-pie', text: 'Dashboard' },
                { id: 'siswa', icon: 'fa-users', text: 'Data Siswa' },
                { id: 'guru', icon: 'fa-user-tie', text: 'Data Guru' },
                { id: 'input', icon: 'fa-clipboard-list', text: 'Kelola Absen (Manual)' },
                { id: 'scan', icon: 'fa-qrcode', text: 'Scan Presensi' },
                { id: 'laporan', icon: 'fa-file-alt', text: 'Laporan' },
                { id: 'pengaturan', icon: 'fa-gear', text: 'Pengaturan' }
            ],
            siswa: [
                { id: 'dashboard', icon: 'fa-home', text: 'Beranda' },
                { id: 'kartu', icon: 'fa-id-card', text: 'Kartu QR Digital' },
                { id: 'edit_profil', icon: 'fa-user-edit', text: 'Edit Profil' }
            ]
        };

        function setupSidebar() {
            const list = $('menuList');
            list.innerHTML = '';
            const userMenus = menus[appState.user.role];
            
            userMenus.forEach(m => {
                const li = document.createElement('li');
                li.innerHTML = `
                    <a href="#" onclick="switchMenu('${m.id}')" id="menu-${m.id}" class="flex items-center gap-3 px-4 py-3 rounded-xl text-indigo-100 hover:bg-indigo-800 hover:text-white transition-all">
                        <i class="fa-solid ${m.icon} w-5 text-center"></i>
                        <span class="font-medium text-sm">${m.text}</span>
                    </a>
                `;
                list.appendChild(li);
            });
        }

        function switchMenu(viewId) {
            if(appState.scanner && viewId !== 'scan') stopScanner(); // matiin kamera kalo pindah halaman

            appState.currentView = viewId;
            const content = $('mainContent');
            content.innerHTML = ''; // bersihkan konten lama

            // Update UI Aktif Sidebar
            document.querySelectorAll('#menuList a').forEach(a => a.classList.remove('bg-indigo-800', 'text-white', 'shadow-md'));
            const activeMenu = $(`menu-${viewId}`);
            if(activeMenu) activeMenu.classList.add('bg-indigo-800', 'text-white', 'shadow-md');

            // Render view sesuai ID
            if (appState.user.role === 'guru') {
                switch(viewId) {
                    case 'dashboard': renderAdminDashboard(content); break;
                    case 'siswa': renderTable(content, 'siswa'); break;
                    case 'guru': renderTable(content, 'guru'); break;
                    case 'input': renderInputPresensi(content); break;
                    case 'scan': renderScanPresensi(content); break;
                    case 'laporan': renderLaporan(content); break;
                    default: content.innerHTML = '<div class="p-8 text-center text-gray-500">Fitur sedang dalam pengembangan</div>';
                }
            } else {
                switch(viewId) {
                    case 'dashboard': renderSiswaDashboard(content); break;
                    case 'kartu': renderKartuSiswa(content); break;
                    default: content.innerHTML = '<div class="p-8 text-center text-gray-500">Fitur sedang dalam pengembangan</div>';
                }
            }
            
            // Set Page Title
            if(activeMenu) $('pageTitle').innerText = activeMenu.innerText;
            if(window.innerWidth < 768) toggleSidebar(); // auto close on mobile
        }

        function renderAdminDashboard(container) {
            const tpl = $('tpl-dashboard-admin').content.cloneNode(true);
            container.appendChild(tpl);
            
            // Set Data Simulasi
            $('statTotal').innerText = mockData.siswa.length;
            $('statHadir').innerText = mockData.presensiHariIni.filter(p => p.status === 'H').length;
            
            // Inisialisasi Chart.js
            setTimeout(() => {
                const ctx = $('attendanceChart').getContext('2d');
                new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: ['Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat'],
                        datasets: [{
                            label: 'Kehadiran (%)',
                            data: [95, 98, 92, 100, 85],
                            backgroundColor: 'rgba(59, 130, 246, 0.8)',
                            borderRadius: 6
                        }]
                    },
                    options: { responsive: true, maintainAspectRatio: false }
                });
            }, 100);
        }

        function renderTable(container, type) {
            const tpl = $('tpl-data-table').content.cloneNode(true);
            container.appendChild(tpl);
            
            const head = $('tableHead');
            const body = $('tableBody');
            
            if (type === 'siswa') {
                $('tableFilterClass').classList.remove('hidden'); // Tampilkan filter kelas
                head.innerHTML = `
                    <th class="px-4 py-3">No</th><th class="px-4 py-3">NIS</th>
                    <th class="px-4 py-3">Nama Siswa</th><th class="px-4 py-3">Kelas</th>
                    <th class="px-4 py-3">L/P</th><th class="px-4 py-3 text-right">Aksi</th>
                `;
                mockData.siswa.forEach((s, i) => {
                    body.innerHTML += `
                        <tr class="border-b hover:bg-gray-50">
                            <td class="px-4 py-3">${i+1}</td>
                            <td class="px-4 py-3 font-medium text-gray-900">${s.nis}</td>
                            <td class="px-4 py-3">${s.nama}</td>
                            <td class="px-4 py-3">${s.kelas}</td>
                            <td class="px-4 py-3">${s.jk}</td>
                            <td class="px-4 py-3 text-right">
                                <button class="text-blue-600 hover:text-blue-800 mr-3"><i class="fa-solid fa-pen-to-square"></i></button>
                                <button class="text-red-600 hover:text-red-800" onclick="alert('Hapus dengan peringatan!')"><i class="fa-solid fa-trash"></i></button>
                            </td>
                        </tr>
                    `;
                });
            } else {
                head.innerHTML = `
                    <th class="px-4 py-3">No</th><th class="px-4 py-3">NIP/Username</th>
                    <th class="px-4 py-3">Nama Guru</th><th class="px-4 py-3">Guru Kelas</th>
                    <th class="px-4 py-3 text-right">Aksi</th>
                `;
                mockData.guru.forEach((g, i) => {
                    body.innerHTML += `
                        <tr class="border-b hover:bg-gray-50">
                            <td class="px-4 py-3">${i+1}</td>
                            <td class="px-4 py-3 font-medium text-gray-900">${g.nip}</td>
                            <td class="px-4 py-3">${g.nama}</td>
                            <td class="px-4 py-3">${g.kelas}</td>
                            <td class="px-4 py-3 text-right">
                                <button class="text-blue-600 hover:text-blue-800 mr-3"><i class="fa-solid fa-pen-to-square"></i></button>
                                <button class="text-red-600 hover:text-red-800"><i class="fa-solid fa-trash"></i></button>
                            </td>
                        </tr>
                    `;
                });
            }
        }

        function renderInputPresensi(container) {
            const tpl = $('tpl-input-presensi').content.cloneNode(true);
            container.appendChild(tpl);
            renderPresensiList();
        }

        function renderPresensiList() {
            const list = $('presensiList');
            if(!list) return;
            const selectedClass = $('presensiClass').value;
            list.innerHTML = '';
            
            const students = mockData.siswa.filter(s => s.kelas === selectedClass);
            students.forEach((s, i) => {
                // Cek jika sudah diabsen (mocking data)
                const isAbsen = mockData.presensiHariIni.find(p => p.nis === s.nis);
                const status = isAbsen ? isAbsen.status : '';

                list.innerHTML += `
                    <tr class="border-b hover:bg-gray-50">
                        <td class="px-6 py-4">${i+1}</td>
                        <td class="px-6 py-4 font-medium text-gray-900">${s.nis}</td>
                        <td class="px-6 py-4">${s.nama}</td>
                        <td class="px-6 py-4 text-center">
                            <div class="flex gap-4 justify-center">
                                <label class="cursor-pointer text-green-600 font-bold"><input type="radio" name="st_${s.nis}" value="H" class="mr-1" ${status==='H'?'checked':''}>H</label>
                                <label class="cursor-pointer text-yellow-600 font-bold"><input type="radio" name="st_${s.nis}" value="S" class="mr-1" ${status==='S'?'checked':''}>S</label>
                                <label class="cursor-pointer text-purple-600 font-bold"><input type="radio" name="st_${s.nis}" value="I" class="mr-1" ${status==='I'?'checked':''}>I</label>
                                <label class="cursor-pointer text-red-600 font-bold"><input type="radio" name="st_${s.nis}" value="A" class="mr-1" ${status==='A'?'checked':''}>A</label>
                            </div>
                        </td>
                        <td class="px-6 py-4"><input type="text" class="border rounded p-1 w-full text-xs" placeholder="Keterangan"></td>
                    </tr>
                `;
            });
        }

        function setAll(val) {
            document.querySelectorAll(`input[type="radio"][value="${val}"]`).forEach(r => r.checked = true);
        }

        function savePresensiManual() {
            alert("Data presensi berhasil disimpan (Simulasi). Menimpa scan mandiri.");
        }

        function renderScanPresensi(container) {
            const tpl = $('tpl-scan-presensi').content.cloneNode(true);
            container.appendChild(tpl);
            
            // Ambil GPS
            if(navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    pos => {
                        $('gpsLat').innerText = pos.coords.latitude.toFixed(5);
                        $('gpsLng').innerText = pos.coords.longitude.toFixed(5);
                    },
                    err => {
                        $('gpsLat').innerText = "Ditolak";
                        $('gpsLng').innerText = "Ditolak";
                    }
                );
            }

            // Render Log Awal
            updateScanLogs();

            // Mulai Scanner setelah render HTML selesai
            setTimeout(() => initScanner(), 300);
        }

        function initScanner() {
            if(appState.scanner) return;
            appState.scanner = new Html5Qrcode("reader");
            startScanner();
        }

        function startScanner() {
            $('btnScanStop').classList.remove('hidden');
            appState.scanner.start(
                { facingMode: appState.facingMode },
                { fps: 10, qrbox: { width: 250, height: 250 } },
                (decodedText, decodedResult) => {
                    // Ketika QR sukses discan
                    handleScanSuccess(decodedText);
                    // Pause sebentar
                    stopScanner();
                    setTimeout(() => startScanner(), 3000); // nyala lagi setelah 3 detik
                },
                (errorMessage) => { /* abaikan error scanning berulang */ }
            ).catch(err => {
                $('reader').innerHTML = `<div class="text-red-500 p-4 text-center text-sm">Akses kamera gagal/ditolak. Pastikan HTTPS & izin diberikan.</div>`;
            });
        }

        function stopScanner() {
            if(appState.scanner && appState.scanner.isScanning) {
                appState.scanner.stop().then(() => {
                    $('btnScanStop').classList.add('hidden');
                });
            }
        }

        function toggleCamera() {
            stopScanner();
            appState.facingMode = appState.facingMode === "environment" ? "user" : "environment";
            setTimeout(() => startScanner(), 500);
        }

        function handleScanSuccess(nis) {
            // Cari siswa berdasarkan NIS
            const siswa = mockData.siswa.find(s => s.nis === nis);
            if(siswa) {
                const time = new Date().toLocaleTimeString('id-ID', { hour12: false, hour: '2-digit', minute:'2-digit' });
                // Tambah ke data mock
                mockData.presensiHariIni.unshift({
                    nis: siswa.nis, nama: siswa.nama, status: 'H', waktu: time, metode: 'Scan QR'
                });
                updateScanLogs();
                alert(`Presensi Berhasil: ${siswa.nama}`);
            } else {
                alert(`NIS ${nis} tidak ditemukan!`);
            }
        }

        function updateScanLogs() {
            const logContainer = $('scanLogs');
            if(mockData.presensiHariIni.length === 0) return;
            
            logContainer.innerHTML = '';
            mockData.presensiHariIni.forEach(p => {
                logContainer.innerHTML += `
                    <div class="flex items-center justify-between p-3 border-b border-gray-100 hover:bg-gray-50">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-full bg-green-100 text-green-600 flex items-center justify-center font-bold">
                                ${p.status}
                            </div>
                            <div>
                                <p class="text-sm font-bold text-gray-800">${p.nama} <span class="text-xs text-gray-500 font-normal">(${p.nis})</span></p>
                                <p class="text-xs text-gray-500">${p.metode}</p>
                            </div>
                        </div>
                        <div class="text-sm font-semibold text-gray-600">${p.waktu}</div>
                    </div>
                `;
            });
        }

        function renderSiswaDashboard(container) {
            const tpl = $('tpl-dashboard-siswa').content.cloneNode(true);
            container.appendChild(tpl);
            $('studentNameDisplay').innerText = appState.user.nama;
            $('studentNisDisplay').innerText = appState.user.nis;
            
            const tbody = $('studentHistoryTable');
            tbody.innerHTML = `
                <tr class="border-b"><td class="px-4 py-2">Hari ini</td><td class="px-4 py-2">06:45</td><td class="px-4 py-2 text-green-600 font-bold">Hadir</td></tr>
                <tr class="border-b"><td class="px-4 py-2">Kemarin</td><td class="px-4 py-2">06:50</td><td class="px-4 py-2 text-green-600 font-bold">Hadir</td></tr>
            `;
        }

        function renderKartuSiswa(container) {
            const tpl = $('tpl-kartu-siswa').content.cloneNode(true);
            container.appendChild(tpl);
            
            $('cardName').innerText = appState.user.nama;
            $('cardDetails').innerText = `NIS: ${appState.user.nis} | Kelas: ${appState.user.kelas}`;
            
            // Generate QR Code menggunakan qrcode.js
            setTimeout(() => {
                $('qrcodeBox').innerHTML = ''; // bersihkan
                new QRCode($('qrcodeBox'), {
                    text: appState.user.nis, // Data yang discan adalah NIS
                    width: 150,
                    height: 150,
                    colorDark : "#1e3a8a", // indigo-900
                    colorLight : "#ffffff",
                    correctLevel : QRCode.CorrectLevel.H
                });
            }, 100);
        }

        function renderLaporan(container) {
            const tpl = $('tpl-laporan').content.cloneNode(true);
            container.appendChild(tpl);
            
            const now = new Date();
            const dateStr = now.toLocaleDateString('id-ID', { year: 'numeric', month: 'long', day: 'numeric' });
            $('printDate').innerText = dateStr;
            $('sigDate').innerText = dateStr;

            const tbody = $('reportTableBody');
            mockData.siswa.forEach((s, i) => {
                const isAbsen = mockData.presensiHariIni.find(p => p.nis === s.nis);
                const status = isAbsen ? isAbsen.status : 'A';
                const waktu = isAbsen ? isAbsen.waktu : '-';
                
                tbody.innerHTML += `
                    <tr>
                        <td class="border border-gray-300 px-4 py-2 text-center">${i+1}</td>
                        <td class="border border-gray-300 px-4 py-2">${s.nis}</td>
                        <td class="border border-gray-300 px-4 py-2">${s.nama}</td>
                        <td class="border border-gray-300 px-4 py-2 text-center font-bold ${status==='H'?'text-green-600': status==='A'?'text-red-600':''}">${status}</td>
                        <td class="border border-gray-300 px-4 py-2 text-center">${waktu}</td>
                    </tr>
                `;
            });
        }
    </script>
</body>
</html>
